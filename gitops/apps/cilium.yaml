apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cilium
  namespace: argocd
spec:
  project: default
  source:
    repoURL: "https://helm.cilium.io/"
    targetRevision: 1.16.1
    chart: cilium
    helm:
      values: |
        eni:
          enabled: true
        ipam:
          mode: eni
        egressMasqueradeInterfaces: "en+"
        routingMode: native
        kubeProxyReplacement: true
        hubble:
          relay:
            enabled: true
          ui:
            enabled: true
  destination:
    server: "https://kubernetes.default.svc"
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
  ignoreDifferences:
    - group: apps
      kind: DaemonSet
      jqPathExpressions:
        - .spec.template.spec.securityContext.appArmorProfile
        - .spec.template.spec.containers[].volumeMounts[].readOnly
        - .spec.template.spec.initContainers[].volumeMounts[].readOnly
