apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cluster-policies
  namespace: argocd
spec:
  project: default
  source:
    repoURL: "https://github.com/omar1111eamsa/cymbal-bank-infrastructure.git"
    targetRevision: main
    path: gitops/policies
  destination:
    server: "https://kubernetes.default.svc"
    namespace: cymbal-bank
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
