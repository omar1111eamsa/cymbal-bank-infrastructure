apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: alerts
  namespace: argocd
spec:
  project: default
  source:
    repoURL: "https://github.com/omar1111eamsa/cymbal-bank-infrastructure.git"
    targetRevision: main
    path: gitops/alerts
  destination:
    server: "https://kubernetes.default.svc"
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
    # The PrometheusRule CRD only exists once the monitoring app is installed:
    # skip the dry run, the retry waits for it on a fresh build
    syncOptions:
      - SkipDryRunOnMissingResource=true