apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cymbal-bank
  namespace: argocd
spec:
  project: default
  source:
    repoURL: "https://github.com/omar1111eamsa/cymbal-bank-manifests.git"
    targetRevision: main
    path: .
  destination:
    server: "https://kubernetes.default.svc"
    namespace: cymbal-bank
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
