apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
spec:
  project: default
  source:
    repoURL: "https://prometheus-community.github.io/helm-charts"
    chart: kube-prometheus-stack
    targetRevision: 92.11.0
    helm:
      releaseName: kube-prometheus-stack
      values: |
        # EKS hides these control-plane parts and there is no kube-proxy (Cilium replaces it)
        kubeControllerManager:
          enabled: false
        kubeScheduler:
          enabled: false
        kubeEtcd:
          enabled: false
        kubeProxy:
          enabled: false

        prometheus:
          prometheusSpec:
            retention: 15d
            retentionSize: 18GB
            serviceMonitorSelectorNilUsesHelmValues: false
            podMonitorSelectorNilUsesHelmValues: false
            ruleSelectorNilUsesHelmValues: false
            resources:
              requests:
                cpu: 200m
                memory: 1Gi
              limits:
                memory: 2Gi
            storageSpec:
              volumeClaimTemplate:
                spec:
                  storageClassName: gp3
                  accessModes: ["ReadWriteOnce"]
                  resources:
                    requests:
                      storage: 20Gi
          additionalServiceMonitors:
            - name: argocd
              namespaceSelector:
                matchNames: [argocd]
              selector:
                matchExpressions:
                  - key: app.kubernetes.io/name
                    operator: In
                    values: [argocd-metrics, argocd-server-metrics, argocd-repo-server-metrics]
              endpoints:
                - port: http-metrics
            - name: hubble
              namespaceSelector:
                matchNames: [kube-system]
              selector:
                matchLabels:
                  k8s-app: hubble
              endpoints:
                - port: hubble-metrics
            - name: karpenter
              namespaceSelector:
                matchNames: [kube-system]
              selector:
                matchLabels:
                  app.kubernetes.io/name: karpenter
              endpoints:
                - port: http-metrics
          additionalPodMonitors:
            - name: cilium-agent
              namespaceSelector:
                matchNames: [kube-system]
              selector:
                matchLabels:
                  k8s-app: cilium
              podMetricsEndpoints:
                - port: prometheus
            - name: cilium-operator
              namespaceSelector:
                matchNames: [kube-system]
              selector:
                matchLabels:
                  io.cilium/app: operator
              podMetricsEndpoints:
                - port: prometheus

        alertmanager:
          config:
            global:
              resolve_timeout: 5m
            # Slack notifications turned off for now: alerts still fire and show in
            # Alertmanager/Grafana, they are just not sent anywhere.
            # To re-enable: receiver: slack, restore the slack receiver and
            # alertmanagerSpec.secrets, and gitops/secrets/alertmanager-slack.yaml
            route:
              receiver: "null"
              group_by: [alertname, namespace]
              group_wait: 30s
              group_interval: 5m
              repeat_interval: 4h
              routes:
                - receiver: "null"
                  matchers:
                    - alertname =~ "Watchdog|InfoInhibitor"
                - receiver: "null"
                  matchers:
                    - severity = "info"
            inhibit_rules:
              - source_matchers:
                  - severity = "critical"
                target_matchers:
                  - severity = "warning"
                equal: [alertname, namespace]
            receivers:
              - name: "null"
          alertmanagerSpec:
            storage:
              volumeClaimTemplate:
                spec:
                  storageClassName: gp3
                  accessModes: ["ReadWriteOnce"]
                  resources:
                    requests:
                      storage: 2Gi

        grafana:
          persistence:
            enabled: false
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 500Mi
  destination:
    server: "https://kubernetes.default.svc"
    namespace: monitoring
  # The Grafana chart generates a random admin password on every render
  # (Argo renders offline, so the chart's lookup can't reuse the existing one):
  # ignore it, or Argo would show OutOfSync and rotate the password forever
  ignoreDifferences:
    - kind: Secret
      name: kube-prometheus-stack-grafana
      namespace: monitoring
      jsonPointers:
        - /data
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
      - RespectIgnoreDifferences=true
