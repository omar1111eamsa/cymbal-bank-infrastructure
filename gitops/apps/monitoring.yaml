apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
spec:
  project: default
  source:
    repoURL: "https://prometheus-community.github.io/helm-charts"
    chart: kube-prometheus-stack
    targetRevision: 92.11.0
    helm:
      releaseName: kube-prometheus-stack
      values: |
        # EKS hides these control-plane parts and there is no kube-proxy (Cilium replaces it)
        kubeControllerManager:
          enabled: false
        kubeScheduler:
          enabled: false
        kubeEtcd:
          enabled: false
        kubeProxy:
          enabled: false

        prometheus:
          prometheusSpec:
            retention: 15d
            retentionSize: 18GB
            serviceMonitorSelectorNilUsesHelmValues: false
            podMonitorSelectorNilUsesHelmValues: false
            ruleSelectorNilUsesHelmValues: false
            resources:
              requests:
                cpu: 200m
                memory: 1Gi
              limits:
                memory: 2Gi
            storageSpec:
              volumeClaimTemplate:
                spec:
                  storageClassName: gp3
                  accessModes: ["ReadWriteOnce"]
                  resources:
                    requests:
                      storage: 20Gi
          additionalServiceMonitors:
            - name: argocd
              namespaceSelector:
                matchNames: [argocd]
              selector:
                matchExpressions:
                  - key: app.kubernetes.io/name
                    operator: In
                    values: [argocd-metrics, argocd-server-metrics, argocd-repo-server-metrics]
              endpoints:
                - port: http-metrics
            - name: hubble
              namespaceSelector:
                matchNames: [kube-system]
              selector:
                matchLabels:
                  k8s-app: hubble
              endpoints:
                - port: hubble-metrics
          additionalPodMonitors:
            - name: cilium-agent
              namespaceSelector:
                matchNames: [kube-system]
              selector:
                matchLabels:
                  k8s-app: cilium
              podMetricsEndpoints:
                - port: prometheus
            - name: cilium-operator
              namespaceSelector:
                matchNames: [kube-system]
              selector:
                matchLabels:
                  io.cilium/app: operator
              podMetricsEndpoints:
                - port: prometheus

        alertmanager:
          config:
            global:
              resolve_timeout: 5m
            route:
              receiver: slack
              group_by: [alertname, namespace]
              group_wait: 30s
              group_interval: 5m
              repeat_interval: 4h
              routes:
                - receiver: "null"
                  matchers:
                    - alertname =~ "Watchdog|InfoInhibitor"
                - receiver: "null"
                  matchers:
                    - severity = "info"
            inhibit_rules:
              - source_matchers:
                  - severity = "critical"
                target_matchers:
                  - severity = "warning"
                equal: [alertname, namespace]
            receivers:
              - name: "null"
              - name: slack
                slack_configs:
                  - api_url_file: /etc/alertmanager/secrets/alertmanager-slack/webhook-url
                    channel: "#alerts"
                    send_resolved: true
                    title: '[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }} ({{ .CommonLabels.severity }})'
                    text: '{{ range .Alerts }}• {{ .Annotations.summary }}{{ if .Annotations.description }} — {{ .Annotations.description }}{{ end }}{{ "\n" }}{{ end }}'
          alertmanagerSpec:
            secrets:
              - alertmanager-slack
            storage:
              volumeClaimTemplate:
                spec:
                  storageClassName: gp3
                  accessModes: ["ReadWriteOnce"]
                  resources:
                    requests:
                      storage: 2Gi

        grafana:
          persistence:
            enabled: false
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 500Mi
  destination:
    server: "https://kubernetes.default.svc"
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
