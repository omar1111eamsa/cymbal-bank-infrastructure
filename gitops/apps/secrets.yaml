apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: secrets
  namespace: argocd
spec:
  project: default
  source:
    repoURL: "https://github.com/omar1111eamsa/cymbal-bank-infrastructure.git"
    targetRevision: main
    path: gitops/secrets
  destination:
    server: "https://kubernetes.default.svc"
  syncPolicy:
    automated:
      prune: true
      selfHeal: true