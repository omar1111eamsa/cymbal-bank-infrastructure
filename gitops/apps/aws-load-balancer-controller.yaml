apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aws-load-balancer-controller
  namespace: argocd
spec:
  project: default
  source:
    repoURL: "https://aws.github.io/eks-charts"
    chart: aws-load-balancer-controller
    targetRevision: 3.6.0
    helm:
      releaseName: aws-load-balancer-controller
      values: |
        clusterName: cymbal-bank-mesh
        region: eu-west-1
        # Look the VPC up by tag (set in vpc.tf): works in any account and after every rebuild
        vpcTags:
          Name: cymbal-bank-vpc
        enableCertManager: true
        replicaCount: 2
        serviceAccount:
          create: true
          name: aws-load-balancer-controller
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            memory: 256Mi
  destination:
    server: "https://kubernetes.default.svc"
    namespace: aws-load-balancer-controller
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
