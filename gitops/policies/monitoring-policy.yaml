# 1. Baseline: every pod in monitoring — deny all, allow DNS out, allow Prometheus to scrape it
apiVersion: "cilium.io/v2"
kind: CiliumNetworkPolicy
metadata:
  name: monitoring-default
  namespace: monitoring
spec:
  description: "Default deny for monitoring; DNS out; Prometheus may scrape every pod"
  endpointSelector: {}
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: prometheus
  egress:
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": kube-system
            "k8s:k8s-app": kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchPattern: "*"
---
# 2. Prometheus: scrape targets only (no internet)
apiVersion: "cilium.io/v2"
kind: CiliumNetworkPolicy
metadata:
  name: prometheus
  namespace: monitoring
spec:
  description: "Prometheus: Grafana may query it; egress only to scrape targets and Alertmanager"
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: grafana
      toPorts:
        - ports:
            - port: "9090"
              protocol: TCP
  egress:
    - toEndpoints:
        - {}                       # any pod in monitoring (exporters, Alertmanager, Grafana)
    - toEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "10250"        # kubelet
              protocol: TCP
            - port: "9100"         # node-exporter (host network)
              protocol: TCP
            - port: "9962"         # cilium-agent
              protocol: TCP
            - port: "9963"         # cilium-operator
              protocol: TCP
            - port: "9965"         # hubble metrics
              protocol: TCP
    - toEntities:
        - kube-apiserver
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": kube-system
            "k8s:k8s-app": kube-dns
      toPorts:
        - ports:
            - port: "9153"         # CoreDNS metrics
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": argocd
      toPorts:
        - ports:
            - port: "8080"         # applicationset-controller
              protocol: TCP
            - port: "8082"         # application-controller
              protocol: TCP
            - port: "8083"         # server
              protocol: TCP
            - port: "8084"         # repo-server
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": external-secrets
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
---
# 3. Grafana: talks only to Prometheus, Alertmanager and the API server
apiVersion: "cilium.io/v2"
kind: CiliumNetworkPolicy
metadata:
  name: grafana
  namespace: monitoring
spec:
  description: "Grafana: egress only to Prometheus, Alertmanager and API server (dashboard sidecars)"
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: grafana
  egress:
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: prometheus
      toPorts:
        - ports:
            - port: "9090"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: alertmanager
      toPorts:
        - ports:
            - port: "9093"
              protocol: TCP
    - toEntities:
        - kube-apiserver
---
# 4. Alertmanager: Grafana may read alerts
apiVersion: "cilium.io/v2"
kind: CiliumNetworkPolicy
metadata:
  name: alertmanager
  namespace: monitoring
spec:
  description: "Alertmanager: Grafana may query it; no egress yet (notifications come later)"
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: alertmanager
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: grafana
      toPorts:
        - ports:
            - port: "9093"
              protocol: TCP
---
# 5. Operator + kube-state-metrics: watch the API server; operator webhook from API server
apiVersion: "cilium.io/v2"
kind: CiliumNetworkPolicy
metadata:
  name: monitoring-api-clients
  namespace: monitoring
spec:
  description: "Operator and kube-state-metrics: egress to API server; operator webhook from API server"
  endpointSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values:
          - kube-prometheus-stack-prometheus-operator
          - kube-state-metrics
  ingress:
    - fromEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "10250"
              protocol: TCP
  egress:
    - toEntities:
        - kube-apiserver