apiVersion: "cilium.io/v2"
kind: CiliumNetworkPolicy
metadata:
  name: frontend-ingress
  namespace: cymbal-bank
spec:
  description: "Allow ALB (world) and loadgenerator to reach the frontend"
  endpointSelector:
    matchLabels:
      app: frontend
  ingress:
    - fromEntities:
        - world
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            app: loadgenerator
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
