# The bank namespace, owned by the platform with its security settings.
# A real resource (not managedNamespaceMetadata): Argo diffs its labels, so any
# change applies right away and selfHeal puts removed labels back.
apiVersion: v1
kind: Namespace
metadata:
  name: cymbal-bank
  annotations:
    argocd.argoproj.io/sync-wave: "-1"                 # exists before anything is created in it
    argocd.argoproj.io/sync-options: Prune=false     # removing this file must never delete the bank
  labels:
    # Istio Ambient: every pod in the namespace goes through ztunnel (mTLS)
    istio.io/dataplane-mode: ambient
    # Pod Security: block dangerous pods now, report what "restricted" still needs
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
