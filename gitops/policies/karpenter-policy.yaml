apiVersion: "cilium.io/v2"
kind: CiliumNetworkPolicy
metadata:
  name: karpenter
  namespace: kube-system
spec:
  description: "Karpenter: Prometheus scrape only; egress to DNS, API server, Pod Identity agent and the AWS APIs it needs"
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: karpenter
  ingress:
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": monitoring
            app.kubernetes.io/name: prometheus
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": kube-system
            "k8s:k8s-app": kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchPattern: "*"
    - toEntities:
        - kube-apiserver
    - toEntities:
        - host                     # EKS Pod Identity agent (169.254.170.23)
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
    - toFQDNs:
        - matchName: ec2.eu-west-1.amazonaws.com        # launch/terminate nodes
        - matchName: sqs.eu-west-1.amazonaws.com        # Spot interruption queue
        - matchName: ssm.eu-west-1.amazonaws.com        # resolve the AMI alias
        - matchName: eks.eu-west-1.amazonaws.com        # cluster details
        - matchName: iam.amazonaws.com                  # instance profiles for nodes
        - matchName: pricing.us-east-1.amazonaws.com    # instance prices (pricing API lives in us-east-1)
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP