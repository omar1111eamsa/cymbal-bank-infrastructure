name: "Checks"

# Runs on every PR and push: catch mistakes before anything is applied
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  terraform:
    # Explicit name: the ruleset requires these checks by name, so keep it stable
    name: "Terraform (${{ matrix.stack }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        stack: [ephemeral, persistent, bootstrap]
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - name: Format
        run: terraform fmt -check -recursive
        working-directory: terraform/${{ matrix.stack }}

      - name: Validate
        run: |
          terraform init -backend=false -input=false
          terraform validate
        working-directory: terraform/${{ matrix.stack }}

      - uses: terraform-linters/setup-tflint@v4

      - name: TFLint
        run: |
          tflint --init
          tflint --format compact
        working-directory: terraform/${{ matrix.stack }}

  checkov:
    name: "Checkov (security misconfigurations)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: terraform,kubernetes
          quiet: true
  
  kubeconform:
    name: "Kubeconform (gitOps manifests)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
    
      - name: Install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz | tar xz
          sudo mv kubeconform /usr/local/bin/
      
      - name: Validate
        run: |
          kubeconform -strict -summary \
          -schema-location default \
          -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
          gitops/